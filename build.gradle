// ========== Documentation Generation ==========
// 在每个 Stonecutter node 注册一份;任务幂等,任意 node 调用结果相同。
// 输入限定顶层模块包(`eyelib.<pkg>`),二级包职责由各自 package-info 表达。

tasks.register('generateModulesMd') {
    group = 'documentation'
    description = 'Generates MODULES.md from package-info.java of top-level module packages.'

    def rootDirObj = rootProject.projectDir
    def modulesDir = new File(rootDirObj, 'src/main/java/io/github/tt432/eyelib')
    def outputFile = new File(rootDirObj, 'MODULES.md')
    inputs.dir(modulesDir)
    outputs.file(outputFile)

    doLast {
        def extractFirstJavadoc = { String text ->
            def matcher = text =~ /(?s)\/\*\*(.*?)\*\//
            if (!matcher.find()) return null
            def lines = matcher.group(1).readLines().collect { it.replaceAll(/^\s*\*\s?/, '') }
            def result = []
            boolean started = false
            for (String line : lines) {
                String trimmed = line.trim()
                if (!trimmed) {
                    if (started) break
                    continue
                }
                if (trimmed.startsWith('@')) break
                result << trimmed
                started = true
            }
            return result.join(' ') ?: null
        }


        File[] subdirs = modulesDir.listFiles({ File f -> f.isDirectory() } as FileFilter)
        if (subdirs == null) {
            throw new GradleException("Cannot read modules dir: ${modulesDir}")
        }
        def packageInfos = subdirs.collect { new File(it, 'package-info.java') }.findAll { it.exists() }
        def missingPackageInfo = subdirs.collect { it.name }
                .findAll { pkg -> !new File(modulesDir, "${pkg}/package-info.java").exists() }
        if (missingPackageInfo) {
            throw new GradleException(
                    "Missing package-info.java in top-level packages: " +
                            missingPackageInfo.collect { "eyelib.${it}" }.join(', ')
            )
        }

        def modules = packageInfos.collect { f ->
            [name: f.parentFile.name, doc: extractFirstJavadoc(f.text)]
        }.sort { it.name }

        def missing = modules.findAll { !it.doc }
        if (missing) {
            throw new GradleException(
                    "Missing first-paragraph Javadoc in package-info.java for: " +
                            missing.collect { "eyelib.${it.name}" }.join(', ')
            )
        }

        StringBuilder md = new StringBuilder()
        md << '# Eyelib Module Inventory\n\n'
        md << '> Auto-generated by `:generateModulesMd`. Do not edit manually.\n'
        md << '> Source: `src/main/java/io/github/tt432/eyelib/*/package-info.java`\n'
        md << '> For boundary rules and interactions, see [docs/decisions/0002-module-boundaries.md](docs/decisions/0002-module-boundaries.md).\n\n'
        md << '## Top-Level Modules\n\n'
        md << '| Package | Responsibility |\n'
        md << '|---|---|\n'
        modules.each { m ->
            md << "| `eyelib.${m.name}` | ${m.doc} |\n"
        }
        md << "\n(${modules.size()} modules)\n"

        outputFile.text = md.toString()
        println "Generated MODULES.md with ${modules.size()} modules"
    }
}

def copyBenchmarkResourcepacks = tasks.register('copyBenchmarkResourcepacks', Copy) {
    from project.file('run/resourcepacks')
    into project.file('run/benchmark/resourcepacks')
}

def copyBenchmarkOptions = tasks.register('copyBenchmarkOptions', Copy) {
    from project.file('run/options.txt')
    into project.file('run/benchmark')
}

def prepareBenchmarkGameDirectory = tasks.register('prepareBenchmarkGameDirectory') {
    dependsOn copyBenchmarkResourcepacks, copyBenchmarkOptions
    def optionsFile = project.file('run/options.txt')
    def resourcepackDir = project.file('run/resourcepacks')
    doLast {
        if (!optionsFile.isFile()) {
            throw new GradleException("Benchmark requires ${optionsFile}")
        }
        def packs = resourcepackDir.listFiles({ File file -> file.isFile() } as FileFilter)
        if (packs == null || packs.length == 0) {
            throw new GradleException("Benchmark requires at least one resource pack in ${resourcepackDir}")
        }
    }
}

tasks.matching { it.name == 'runClientBenchmark' }.configureEach {
    dependsOn prepareBenchmarkGameDirectory
}

tasks.matching { it.name == 'prepareClientBenchmarkRun' }.configureEach {
    dependsOn prepareBenchmarkGameDirectory
}

// NeoForge <26.1（ModDevGradle 1.x）不将 localRuntime 中的外部 mod jar 注册到 mod discovery。
// 通过将 clientsmoke jar 复制到 run/clientsmoke/mods/ 目录，让 NeoForge mod discovery 扫描到它。
if (!isLegacyForge && hasAdditionalRuntimeClasspath) {
    tasks.register('copyClientsmokeToMods', Copy) {
        from(configurations.clientsmokeJar)
        into project.file('run/clientsmoke/mods')
        rename { 'clientsmoke.jar' }
    }
    tasks.register('copyClientsmokeToBenchmarkMods', Copy) {
        from(configurations.clientsmokeJar)
        into project.file('run/benchmark/mods')
        rename { 'clientsmoke.jar' }
    }
    tasks.matching { it.name == 'runClientBenchmark' }.configureEach {
        dependsOn 'copyClientsmokeToBenchmarkMods'
    }
    tasks.matching { it.name == 'prepareClientBenchmarkRun' }.configureEach {
        dependsOn 'copyClientsmokeToBenchmarkMods'
    }
    // 在构建产物生成后复制（createMinecraftArtifacts 是 ModDevGradle 的产物任务）
    tasks.named('createMinecraftArtifacts') {
        finalizedBy 'copyClientsmokeToMods'
    }
}

// 1.21.1：将 LDLib2 jar 复制到 run/mods，让 NeoForge mod discovery 加载它（同 clientsmoke 模式）。
if (!isLegacyForge && hasAdditionalRuntimeClasspath) {
    tasks.register('copyLdlib2ToMods', Copy) {
        from(configurations.ldlib2Jar)
        into project.file('run/mods')
    }
    // 标准 client run 也需 clientsmoke（mcmcp AIDebugServer 宿主）：
    // 既有 copyClientsmokeToMods 只覆盖 run/clientsmoke（clientSmoke 专用 run），
    // 导致 1.21.1 标准 client 无调试端口，与 1.20.1/26.1.2（localRuntime 自动注册）不一致。
    tasks.register('copyClientsmokeToRunMods', Copy) {
        from(configurations.clientsmokeJar)
        into project.file('run/mods')
        rename { 'clientsmoke.jar' }
    }
    tasks.matching { it.name in ['runClient', 'prepareClientRun'] }.configureEach {
        dependsOn 'copyLdlib2ToMods'
        dependsOn 'copyClientsmokeToRunMods'
    }
}
