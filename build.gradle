plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'io.freefair.lombok'
    id 'net.ltgt.errorprone'
    id 'signing'
}

// Stonecutter 0.9 centralScript: 此脚本对每个 version node (:1.20.1, :1.21.1, :26.1.2) 各跑一次。
// 版本比较用 sc.current.parsed.matches（0.8+ API，替代旧 stonecutter.eval）。
def isLegacyForge = sc.current.parsed.matches '<1.20.6'
def isModern = sc.current.parsed.matches '>=26.1'
// 26.1+ 移除了 additionalRuntimeClasspath 配置（模块层系统变更）
def hasAdditionalRuntimeClasspath = sc.current.parsed.matches '<26.1'
def benchmarkProperty = { String name, String defaultValue -> System.getProperty(name, defaultValue) }

// Stonecutter 常量：源码中用 //? if legacy / //? if modern 做三路分支
stonecutter {
    constants['legacy'] = isLegacyForge
    constants['modern'] = isModern
}

// Stonecutter centralScript 不自动替换 sourceSet（0.7-0.9 均如此）：compileJava 默认编译 src/main/java，
// 但加了 //? 注释后原始源码有裸露的 else 分支导致语法错误。
// 必须让 sourceSet 指向 stonecutterGenerate 的生成目录。
def stonecutterMainBase = layout.buildDirectory.dir('generated/stonecutter/main')
sourceSets.main.java.srcDirs = [stonecutterMainBase.map { it.dir('java') }]
sourceSets.main.resources.srcDirs = [stonecutterMainBase.map { it.dir('resources') }]
compileJava.dependsOn 'stonecutterGenerate'
processResources.dependsOn 'stonecutterGenerate'

// Stonecutter file handler 处理 eyelib.mixins.json 的 //? 版本条件（见 stonecutter.gradle 注册 inherit java→json）。
// comment-out 策略产出含注释的 json5，剥离为纯 JSON 供 Mixin 运行时解析。
def cleanGeneratedJson = tasks.register('cleanGeneratedJson') {
    dependsOn 'stonecutterGenerate'
    doLast {
        def file = stonecutterMainBase.get().dir('resources').file('eyelib.mixins.json').asFile
        if (!file.exists()) return
        def text = file.text
        text = text.replaceAll(/(?s)\/\*.*?\*\//, '')
        text = text.replaceAll(/\/\/[^\r\n]*/, '')
        text = text.replaceAll(/,(\s*[\]\}])/, '$1')
        file.text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(new groovy.json.JsonSlurper().parseText(text))
        )
    }
}
processResources.dependsOn cleanGeneratedJson

// 同理，test sourceSet 也需指向 stonecutterGenerateTest 的生成目录。
def stonecutterTestGenerated = layout.buildDirectory.dir('generated/stonecutter/test/java')
sourceSets.test.java.srcDirs = [stonecutterTestGenerated]
compileTestJava.dependsOn 'stonecutterGenerateTest'

if (isLegacyForge) {
    apply plugin: 'net.neoforged.moddev.legacyforge'
} else {
    apply plugin: 'net.neoforged.moddev'
}

if (project == rootProject) {
    tasks.named('wrapper', Wrapper).configure {
        distributionType = Wrapper.DistributionType.BIN
    }
}

version = "${mod_version}+${minecraft_version}-${isLegacyForge ? 'forge' : 'neoforge'}"
group = mod_group_id

repositories {
    mavenCentral()
    mavenLocal()
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    // CurseMaven：通过 CurseForge project/file ID 提供 mod jar。
    // 用于引入 SRG-compiled 的第三方 Forge mod（如 spark），由 localRuntime 触发 ModDevGradle 自动 remap。
    exclusiveContent {
        forRepository {
            maven {
                name = "CurseMaven"
                url = "https://cursemaven.com/"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    // firstdark snapshots：LDLib2（节点图编辑器可选前置，见 docs/specs/nodegraph-visual-molang.md §4）。
    exclusiveContent {
        forRepository {
            maven {
                name = "FirstdarkSnapshots"
                url = "https://maven.firstdark.dev/snapshots"
            }
        }
        filter {
            includeGroup "com.lowdragmc.ldlib2"
        }
    }
    // LDLib2 1.20.1 Forge fork（TT432/LDLib2-1.20.1-Forge，源码级修复后构建）：mavenLocal 手动安装。
    exclusiveContent {
        forRepository { mavenLocal() }
        filter {
            includeGroup "com.github.tt432"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(property('java_version') as int)

if (isLegacyForge) {
    legacyForge {
        // Specify the version of MinecraftForge to use.
        version = project.minecraft_version + '-' + project.forge_version

        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.parchment_minecraft_version
        }

        // ModDevGradle 默认检测 AT 的路径相对 node project dir (versions/<ver>/)，node 下无 src，需显式指向 root
        accessTransformers.from rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

        // Default run configurations.
        // These can be tweaked, removed, or duplicated as needed.
        runs {
            client {
                client()

                // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
                systemProperty 'forge.enabledGameTestNamespaces', project.mod_id

                systemProperty 'eyelib.preventMouseGrab', 'true'
                systemProperty 'eyelib.minimizeWindow', 'true'
            }

            clientSmoke {
                client()
                gameDirectory = project.file('run/clientsmoke')
                systemProperty 'forge.enabledGameTestNamespaces', 'clientsmoke'
                systemProperty 'clientsmoke.enabled', 'true'
                systemProperty 'clientsmoke.autoExit', 'true'
            }

            clientBenchmark {
                client()
                gameDirectory = project.file('run/benchmark')
                systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
                systemProperty 'eyelib.benchmark.enabled', 'true'
                systemProperty 'eyelib.benchmark.autoExit', benchmarkProperty('eyelib.benchmark.autoExit', 'true')
                systemProperty 'eyelib.benchmark.modes', benchmarkProperty('eyelib.benchmark.modes', 'fbo,world,pacing,stability')
                systemProperty 'eyelib.benchmark.entity', benchmarkProperty('eyelib.benchmark.entity', 'minecraft:slime')
                systemProperty 'eyelib.benchmark.entityMix', benchmarkProperty('eyelib.benchmark.entityMix', 'minecraft:slime=24,minecraft:zombie=24,minecraft:skeleton=24,minecraft:cow=24')
                systemProperty 'eyelib.benchmark.counts', benchmarkProperty('eyelib.benchmark.counts', '1,16,64')
                systemProperty 'eyelib.benchmark.warmupSeconds', benchmarkProperty('eyelib.benchmark.warmupSeconds', '15')
                systemProperty 'eyelib.benchmark.measureSeconds', benchmarkProperty('eyelib.benchmark.measureSeconds', '30')
                systemProperty 'eyelib.benchmark.stabilityWarmupSeconds', benchmarkProperty('eyelib.benchmark.stabilityWarmupSeconds', '30')
                systemProperty 'eyelib.benchmark.stabilitySeconds', benchmarkProperty('eyelib.benchmark.stabilitySeconds', '600')
                systemProperty 'eyelib.benchmark.pacingCount', benchmarkProperty('eyelib.benchmark.pacingCount', '16')
                systemProperty 'eyelib.benchmark.stabilityCount', benchmarkProperty('eyelib.benchmark.stabilityCount', '64')
                systemProperty 'eyelib.benchmark.fboSize', benchmarkProperty('eyelib.benchmark.fboSize', '512')
                systemProperty 'eyelib.benchmark.stabilizeTicks', benchmarkProperty('eyelib.benchmark.stabilizeTicks', '100')
                systemProperty 'eyelib.benchmark.maxSamples', benchmarkProperty('eyelib.benchmark.maxSamples', '2000000')
                systemProperty 'eyelib.preventMouseGrab', 'true'
                programArguments.addAll '--width', '1280', '--height', '720'
            }

            server {
                server()
                programArgument '--nogui'
                systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            }

            // This run config launches GameTestServer and runs all registered gametests, then exits.
            // By default, the server will crash when no gametests are provided.
            // The gametest system is also enabled by default for other run configs under the /test command.
            gameTestServer {
                type = "gameTestServer"
                systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            }

            data {
                data()

                // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
                // gameDirectory = project.file('run-data')

                // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
                programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            }

            // applies to all the run configs above
            configureEach {
                // Recommended logging data for a userdev environment
                // The markers can be added/remove as needed separated by commas.
                // "SCAN": For mods scan.
                // "REGISTRIES": For firing of registry events.
                // "REGISTRYDUMP": For getting the contents of all registries.
                systemProperty 'forge.logging.markers', 'REGISTRIES'

                // Recommended logging level for the console
                // You can set various levels here.
                // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }

        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
    }
} else {
    neoForge {
        version = project.neoforge_version

        // ModDevGradle 默认检测 AT 的路径相对 node project dir (versions/<ver>/)，node 下无 src，需显式指向 root
        accessTransformers.from rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

        // 26.1+ 去混淆，无需 parchment
        if (!isModern) {
            parchment {
                mappingsVersion = project.parchment_mappings_version
                minecraftVersion = project.parchment_minecraft_version
            }
        }

        runs {
            client {
                client()
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
                systemProperty 'eyelib.preventMouseGrab', 'true'
                systemProperty 'eyelib.minimizeWindow', 'true'
            }

            clientSmoke {
                client()
                gameDirectory = project.file('run/clientsmoke')
                systemProperty 'neoforge.enabledGameTestNamespaces', 'clientsmoke'
                systemProperty 'clientsmoke.enabled', 'true'
                systemProperty 'clientsmoke.autoExit', 'true'
            }

            clientBenchmark {
                client()
                gameDirectory = project.file('run/benchmark')
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
                systemProperty 'eyelib.benchmark.enabled', 'true'
                systemProperty 'eyelib.benchmark.autoExit', benchmarkProperty('eyelib.benchmark.autoExit', 'true')
                systemProperty 'eyelib.benchmark.modes', benchmarkProperty('eyelib.benchmark.modes', 'fbo,world,pacing,stability')
                systemProperty 'eyelib.benchmark.entity', benchmarkProperty('eyelib.benchmark.entity', 'minecraft:slime')
                systemProperty 'eyelib.benchmark.entityMix', benchmarkProperty('eyelib.benchmark.entityMix', 'minecraft:slime=24,minecraft:zombie=24,minecraft:skeleton=24,minecraft:cow=24')
                systemProperty 'eyelib.benchmark.counts', benchmarkProperty('eyelib.benchmark.counts', '1,16,64')
                systemProperty 'eyelib.benchmark.warmupSeconds', benchmarkProperty('eyelib.benchmark.warmupSeconds', '15')
                systemProperty 'eyelib.benchmark.measureSeconds', benchmarkProperty('eyelib.benchmark.measureSeconds', '30')
                systemProperty 'eyelib.benchmark.stabilityWarmupSeconds', benchmarkProperty('eyelib.benchmark.stabilityWarmupSeconds', '30')
                systemProperty 'eyelib.benchmark.stabilitySeconds', benchmarkProperty('eyelib.benchmark.stabilitySeconds', '600')
                systemProperty 'eyelib.benchmark.pacingCount', benchmarkProperty('eyelib.benchmark.pacingCount', '16')
                systemProperty 'eyelib.benchmark.stabilityCount', benchmarkProperty('eyelib.benchmark.stabilityCount', '64')
                systemProperty 'eyelib.benchmark.fboSize', benchmarkProperty('eyelib.benchmark.fboSize', '512')
                systemProperty 'eyelib.benchmark.stabilizeTicks', benchmarkProperty('eyelib.benchmark.stabilizeTicks', '100')
                systemProperty 'eyelib.benchmark.maxSamples', benchmarkProperty('eyelib.benchmark.maxSamples', '2000000')
                systemProperty 'eyelib.preventMouseGrab', 'true'
                programArguments.addAll '--width', '1280', '--height', '720'
            }

            server {
                server()
                programArgument '--nogui'
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            gameTestServer {
                type = "gameTestServer"
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            if (!isModern) {
                data {
                    data()
                    programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
                }
            }

            configureEach {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }

        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
    }
}

// In-client UI test harness：-PldTest 接线 + verifyUiTest 验收闸门（MDG 适配版脚本）。
// 必须放在 legacyForge/neoForge 配置块之后（脚本要访问其 runs 容器）。
apply from: rootProject.file('gradle/ldlib2-uitest.gradle')

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets {
    test {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    nullawayProcessor
    // 1.21.1 专用：LDLib2 jar 独立 configuration（不继承 runtimeClasspath，避免 classpath+mods 双份加载），
    // 由 copyLdlib2ToMods 复制进 run/mods 供 mod discovery（同 clientsmokeJar 模式）。
    // transitive=false：ldlib2 pom 声明的 fastutil/kotlin-stdlib/taffy/yoga 不是合法 mod 文件，
    // 被 copy 进 run/mods 会触发 LoadingErrorScreen；:all fat jar 已内嵌这些依赖。
    ldlib2Jar {
        transitive = false
    }
    // 1.20.1 专用：LDLib（SRG）编译路径，由 obfuscation.createRemappingConfiguration 生成 modLdlibCompile 做 SRG→Mojmap remap。
    ldlibCompile
}
if (isLegacyForge) {
    obfuscation {
        createRemappingConfiguration(configurations.localRuntime)
        createRemappingConfiguration(configurations.ldlibCompile)
    }
    // LDLib 编译产物进 compileOnly（remap 后），源码侧 import com.lowdragmc.* 才可用 mojmap 名编译。
    configurations.compileOnly.extendsFrom configurations.ldlibCompile
}

// ModDevGradle ObfuscationExtension.reobfuscate() replaces apiElements/runtimeElements with
// dependency-free reobf variants. This is correct for Forge mod distribution:
// MC/Forge/mappings are provided by the game, jarJar deps are bundled in the jar.
// Do NOT make reobfRuntimeElements extendFrom runtimeClasspath — it leaks MC internals
// (mcp_config zip, forge artifacts) which break composite build consumers with variant
// attribute conflicts (minecraft_mappings.v2 = 'srg').

// 独立 configuration 用于解析 clientsmoke jar（不继承到 runtimeClasspath，避免 classpath 冲突）
configurations {
    clientsmokeJar {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}
dependencies {
    // 显式添加 Lombok：neoForge plugin 的 ModDevGradle 可能重配置 annotationProcessorPath，
    // 覆盖 freefair lombok 插件自动添加的处理器。显式声明确保 Lombok 在所有 node 生效。
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    // AR mod 仅 < 26.1 有兼容 jar；26.1+ VertexConsumer API 变更导致 @ExtensionMethod 失配。
    if (!isModern) {
        compileOnly("maven.modrinth:acceleratedrendering:1.0.5-1.20.1-alpha")
    }

    compileOnly "io.github.tt432:clientsmoke:${version}"
    // NeoForge <26.1（ModDevGradle 1.x）的 localRuntime 不将外部 mod jar 注册到 mod discovery。
    // >=26.1（ModDevGradle 2.x）和 Forge 自动注册。
    // 1.21.1 需要 copyClientsmokeToMods 任务（见文件底部）将 jar 复制到 mods/ 目录。
    // 注意：1.21.1 不能用 localRuntime（jar 会在 classpath + mods/ 双份导致类加载冲突）。
    if (!isLegacyForge && !isModern) {
        // 独立 configuration，不继承到 runtimeClasspath
        clientsmokeJar "io.github.tt432:clientsmoke:${version}"
    } else {
        localRuntime "io.github.tt432:clientsmoke:${version}"
    }

    // spark 性能剖析工具（dev-only，localRuntime 不进发布 jar）。
    // 必须用 modLocalRuntime（由 obfuscation.createRemappingConfiguration 创建），
    // ModDevGradle 会自动 SRG→Mojmap remap；加到 localRuntime 不 remap，会因 SRG 名 NoSuchMethodError 崩溃。
    // CurseForge file 4738952 = spark-1.10.53-forge.jar，1.20.1 forge 唯一兼容版本。
    if (isLegacyForge) {
        modLocalRuntime "curse.maven:spark-361579:4738952"
    }

    // LDLib2：节点图编辑器可选前置（docs/specs/nodegraph-visual-molang.md D7）。
    // compileOnly + dev runtime，不 jarJar 嵌入产物；运行时缺失时编辑器入口关闭。
    if (isLegacyForge) {
        // LDLib2 1.20.1 Forge fork（TT432/LDLib2-1.20.1-Forge，work/LDLib2-fork 构建）：SRG 名，modId=ldlib2，
        // -all.jar 内嵌 yoga/taffy，kotlin-stdlib 需显式补（fastutil 由 MC 提供）。
        modLdlibCompile "com.github.tt432:ldlib2-forge-1.20.1:2.2.34+forge.1.20.1-fork.3"
        modLocalRuntime "com.github.tt432:ldlib2-forge-1.20.1:2.2.34+forge.1.20.1-fork.3"
        compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.1.20"
        // 移植版 mods.toml 强制前置 kotlinforforge [4.11.0,)。
        modLocalRuntime "maven.modrinth:kotlin-for-forge:4.11.0"
    } else if (isModern) {
        // LDLib2 26.1.x（mojmap，modId=ldlib2）；MDG 2.x localRuntime 自动注册 mod discovery。
        compileOnly "com.lowdragmc.ldlib2:ldlib2-neoforge-26.1:26.1.2.33"
        localRuntime "com.lowdragmc.ldlib2:ldlib2-neoforge-26.1:26.1.2.33"
        // 编辑器适配层单测（EvmGraphTranslatorTest）需要 LDLib2 在 test 运行时 classpath。
        testRuntimeOnly "com.lowdragmc.ldlib2:ldlib2-neoforge-26.1:26.1.2.33"
    } else {
        // LDLib2 1.21.1（mojmap，modId=ldlib2，:all 含全部资源）；
        // MDG 1.x localRuntime 不注册 mod discovery 且会双份加载 → 独立 configuration + copy 到 run/mods。
        compileOnly "com.lowdragmc.ldlib2:ldlib2-neoforge-1.21.1:2.2.34:all"
        ldlib2Jar "com.lowdragmc.ldlib2:ldlib2-neoforge-1.21.1:2.2.34:all"
        testRuntimeOnly "com.lowdragmc.ldlib2:ldlib2-neoforge-1.21.1:2.2.34:all"
    }

    if (hasAdditionalRuntimeClasspath) {
        jarJar additionalRuntimeClasspath(implementation('io.github.dmlloyd:jdk-classfile-backport:24.0'))
        jarJar additionalRuntimeClasspath(implementation('com.h2database:h2:2.4.240'))
    } else {
        jarJar(implementation('io.github.dmlloyd:jdk-classfile-backport:24.0'))
        jarJar(implementation('com.h2database:h2:2.4.240'))
    }

    compileOnly 'org.jspecify:jspecify:1.0.0'
    errorprone 'com.google.errorprone:error_prone_core:2.42.0'
    errorprone 'com.uber.nullaway:nullaway:0.13.7'
    nullawayProcessor 'org.projectlombok:lombok:1.18.46'
    nullawayProcessor 'com.google.guava:guava:33.4.0-jre'
    nullawayProcessor 'com.google.errorprone:error_prone_core:2.42.0'
    nullawayProcessor 'com.uber.nullaway:nullaway:0.13.7'

    if (isLegacyForge) {
        compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.0'))
        implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.5.0'))
    }

//    implementation("maven.modrinth:physicsmod:3.0.20")

//    implementation "org.lwjgl:lwjgl-assimp:3.3.3"
//    runtimeOnly "org.lwjgl:lwjgl-assimp:3.3.3:natives-windows"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.h2database:h2:2.4.240'
    testImplementation 'com.tngtech.archunit:archunit:1.4.2'
    testImplementation 'com.tngtech.archunit:archunit-junit5-api:1.4.2'
    testRuntimeOnly 'com.tngtech.archunit:archunit-junit5-engine:1.4.2'
    testImplementation sourceSets.main.output
}

if (isLegacyForge) {
    mixin {
        add sourceSets.main, "${mod_id}.refmap.json"
        config "${mod_id}.mixins.json"
    }

    dependencies {
        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    }
}

jar {
    if (isLegacyForge) {
        manifest.attributes([
                "MixinConfigs": "${mod_id}.mixins.json"
        ])
    }
}

signing {
    sign publishing.publications
}

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.named('javadoc', Javadoc).configure {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
    // Use original source (not delombok) to avoid delombok configuration-cache issues
    source = sourceSets.main.allJava
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : findProperty('forge_version') ?: '',
            forge_version_range    : findProperty('forge_version_range') ?: '',
            loader_version_range   : findProperty('loader_version_range') ?: '',
            neoforge_version       : findProperty('neoforge_version') ?: '',
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from stonecutterMainBase.map { it.dir('templates') }
    // NeoForge 1.20.6+ requires neoforge.mods.toml; Forge 1.20.1 requires mods.toml
    if (isLegacyForge) {
        exclude 'META-INF/neoforge.mods.toml'
    } else {
        exclude 'META-INF/mods.toml'
    }
    into "build/generated/sources/modMetadata"
}
generateModMetadata.configure { dependsOn 'stonecutterGenerate' }
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
if (isLegacyForge) {
    legacyForge.ideSyncTask generateModMetadata
} else {
    neoForge.ideSyncTask generateModMetadata
