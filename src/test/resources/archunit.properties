# 基线提交在 archunit_store/<node>/。
# 注意：FreezingArchRule 1.4.2 会无条件重写 store，allowStoreUpdate=false 会让每条规则抛
# StoreUpdateFailedException，因此"新增违规不得被吸收"由 build.gradle 的 test 闸门
# （测试前后基线行数快照，只允许缩小）保证，而不是靠 ArchUnit 自身配置。
freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreUpdate=true
