modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
mandatory=true
versionRange="${loader_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# LDLib2 可选前置：节点图编辑器（docs/specs/nodegraph-visual-molang.md D7）。未安装时编辑器入口关闭，其余功能不受影响。
[[dependencies.${mod_id}]]
modId="ldlib2"
mandatory=false
versionRange="[2.2.32,)"
ordering="AFTER"
side="CLIENT"
