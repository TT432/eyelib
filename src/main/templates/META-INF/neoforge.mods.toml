modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
mandatory=true
versionRange="${loader_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# LDLib2（modId=ldlib2，节点图编辑器）自 ADR-0030 起 jarJar 内嵌进产物 jar，不再需要外部安装，
# 也不再声明 dependencies——mods 文件夹中若存在更高版本的独立 ldlib2，由 jarjar 版本协商接管。
